name: Tests

# Every push to main and every pull request: the whole suite (tests/run.py) --
# the firmware on MicroPython built with single-precision floats like the
# ESP32-S3, the plugin API, both packs, and the Provisioner (manifest hashes,
# pack checks, uploads against a simulated board). Releases are built by
# release.yml, which runs the same suite first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for 26.04 yet (Arborist's test)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Packages for Stump on a computer, and mpy-cross
        run: python3 -m pip install cryptography pyserial mpy-cross==1.28.0.post2

      - name: MicroPython (cached)
        id: mp-cache
        uses: actions/cache@v4
        with:
          path: ~/micropython-f32
          key: micropython-f32-${{ hashFiles('scripts/build_micropython.sh') }}

      - name: Build MicroPython, single-precision floats
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: sh scripts/build_micropython.sh ~/micropython-f32

      - name: Every Python file compiles (CPython and MicroPython)
        run: |
          python3 -m py_compile provisioner.py scripts/*.py tests/*.py
          find final_firmware packs -name '*.py' -not -path '*/third_party/*' | while read f; do
            ~/micropython-f32/micropython -c "compile(open('$f').read(), '$f', 'exec')" || exit 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright's Chromium (Arborist's test)
        run: |
          npm install --no-save --prefix "$HOME/pw" playwright@1.56.0
          "$HOME/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$HOME/pw/node_modules" >> "$GITHUB_ENV"

      - name: Test suite
        run: |
          export MICROPYTHON=$HOME/micropython-f32/micropython
          python3 tests/run.py

      - name: The firmware compiled (.mpy), as the Provisioner puts it on a board
        run: |
          export MICROPYTHON=$HOME/micropython-f32/micropython
          export MPY_CROSS=$(python3 -c "import mpy_cross, os; print(os.path.join(os.path.dirname(mpy_cross.__file__), 'mpy-cross'))")
          $MPY_CROSS --version
          python3 tests/run.py chat_golden mesh_golden plugin_api packs_web json_api conn_limits identity_matrix hardening tools_sections

      - name: The release builds, reproducibly
        run: |
          V=$(sed -n 's/^STUMP_RELEASE = "\(.*\)"/\1/p' final_firmware/example_node.py)
          python3 scripts/build_release.py "$V" dist-a > /dev/null
          python3 scripts/build_release.py "$V" dist-b > /dev/null
          diff dist-a/SHA256SUMS dist-b/SHA256SUMS
          cat dist-a/SHA256SUMS

      - name: Arborist, with MicroPython from micropython.org (to try on a board)
        run: python3 scripts/build_arborist.py dist-arborist

      - name: Keep Arborist
        uses: actions/upload-artifact@v4
        with:
          name: Arborist
          path: dist-arborist/*.html

  # µReticulum (final_firmware/urns) against the reference rns/lxmf: keys,
  # addresses, signatures, encryption and LXMF messages, both directions
  # (tests/reference). Twice: the version FireFly for Android pins, and the
  # newest release (what FireFly handhelds install), so an upstream protocol
  # change shows up here. (Their names are required checks on main.)
  reference:
    name: Tests (reference rns ${{ matrix.rns }})
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for 26.04 yet (Arborist's test)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - rns: "1.5.5"
            pip: "rns==1.5.5 lxmf==1.2.0"
          - rns: "latest"
            pip: "rns lxmf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: The reference Reticulum and LXMF
        run: pip install pytest cryptography ${{ matrix.pip }}
      - name: urns against them
        run: python -m pytest -v tests/reference
      - name: The NomadNet pack, browsed by the reference library over a real link
        run: |
          pip install pyserial cbor2 nomadnet "git+https://github.com/kc1awv/rrcd@f6d7e9d72bf83c70d7a9373ae8c5edaa052a7bf2"
          python tests/pc/pc_nomadnet_test.py
      - name: Found with no setup on a shared network (AutoInterface, two network namespaces)
        run: sudo "$(which python)" tests/pc/pc_autointerface_test.py
      - name: "/names in #lora-mesh on the kit bench (a chain with and without a radio, two Stumps on their own), and after a restart"
        if: matrix.rns == 'latest'
        run: python tests/pc/pc_lora_names_test.py

  # Stump on a computer (docs/PC.md) on the systems people will run it on:
  # a Stump folder made by the Provisioner, started, every page checked.
  # (The chain half, with a MicroPython CAM, runs in the Linux job above.)
  computer:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: the processor a Raspberry Pi has (Stump OS, pi/; 1.0.0-beta.87).
        os: [windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Packages
        run: python -m pip install cryptography pyserial
      - name: A Stump on this computer
        run: python tests/pc/pc_chain_test.py
      - name: The chain checks (--check-chain)
        run: python tests/pc/pc_joins_cam_test.py
      - name: The Heltec on USB, against a simulated RNode
        if: runner.os == 'macOS'
        run: python tests/pc/rnode_serial_test.py
      - name: USB <-> Bluetooth switch, against simulated RNodes
        if: runner.os == 'macOS'
        run: python tests/pc/radio_link_test.py
      - name: The Heltec over Bluetooth, against a simulated RNode
        run: python tests/pc/rnode_ble_test.py
      - name: "#lora-mesh between Stumps over the radio"
        run: python tests/pc/lora_radio_test.py
      - name: "#lora-mesh across a chain with radios (Wi-Fi first, once on the radio, No LoRa on mesh)"
        run: python tests/pc/lora_mesh_test.py
      - name: Rooms with a scope (/create, /setchan, /chanreq, the chain, LoRa offers)
        run: python tests/pc/room_scopes_test.py
      - name: "Stump names: one set up again takes its name back, quiet Stumps expire, renames follow"
        run: python tests/pc/stump_names_test.py


      - name: Turning the Stump off from /admin
        run: python tests/pc/pc_power_test.py
      - name: "Stump OS: the admin password claimed at the first visit, the Pi's card (update, shutdown)"
        run: python tests/pc/stump_os_test.py
      - name: The Stump's settings changed from /admin
        run: python tests/pc/settings_test.py
      - name: Finding a Stump on the Wi-Fi (STUMP? on UDP 4244)
        run: python tests/pc/discovery_test.py
      - name: The computer's "card" (uploads, PC_STORAGE_MB)
        run: python tests/pc/storage_test.py
      - name: Connections that hold the Stump (slow, silent, endless)
        run: python tests/pc/conn_test.py
      - name: The watchdog and the rescue start (a frozen Stump, failed starts)
        run: python tests/pc/watchdog_test.py

  # The same suite on a build with the Stump frozen in, the way a Stump
  # image has it (image/README.md): the test tree holds only what such a
  # board has on its filesystem (config.py, main.py, the plugin folders,
  # web, lib); the Stump runs from the frozen modules.
  frozen:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for 26.04 yet (Arborist's test)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Packages
        run: python3 -m pip install cryptography pyserial mpy-cross==1.28.0.post2

      - name: MicroPython with the Stump frozen in
        run: sh scripts/build_micropython_frozen.sh ~/micropython-frozen

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright's Chromium (Arborist's test)
        run: |
          npm install --no-save --prefix "$HOME/pw" playwright@1.56.0
          "$HOME/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$HOME/pw/node_modules" >> "$GITHUB_ENV"

      - name: Test suite, the Stump frozen
        run: |
          export MICROPYTHON=$HOME/micropython-frozen/micropython
          export STUMP_FROZEN=1
          python3 tests/run.py
