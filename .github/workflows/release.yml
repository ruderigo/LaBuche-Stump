name: Release

# Push a tag like v1.0.0-beta.1 (matching STUMP_RELEASE in
# final_firmware/example_node.py) to test, build and publish a release:
#
#   Stump-<version>.zip     provisioner.py + final_firmware/ + packs/, one folder
#   provisioner.py          on its own
#   Stump-<v>.bundle        what Arborist carries, as a file of its own: MicroPython,
#                           the Stump compiled, the config.py template (for tools
#                           that make Stumps like Arborist; build_arborist.py)
#   Arborist-<v>.html       makes and looks after a Stump (an S3-CAM or a WROVER
#                           on USB) from Chrome or Edge, saved and opened on the
#                           computer, the Stump images inside (scripts/build_arborist.py)
#   <pack>-pack-<v>.zip     each pack
#   stump-<v>-wrover.bin    the Stump image for an ESP32-WROVER (flash at 0x1000)
#   stump-<v>-s3cam.bin     the Stump image for an ESP32-S3-CAM (flash at 0x0)
#                           (MicroPython with the Stump frozen in: image/README.md,
#                           built by the Stump images workflow)
#   MANIFEST.json           size and SHA-256 of every file inside every zip
#   SHA256SUMS              SHA-256 of each release file
#   SHA256SUMS.rnsig        Ed25519 signature by the release's Reticulum
#                           identity (when the STUMP_RELEASE_IDENTITY secret
#                           is set; see docs/RELEASE.md)
#
# Every file also gets a signed build-provenance attestation (Sigstore,
# keyless): `gh attestation verify <file> --repo <this repo>` proves it was
# built here, by this workflow, from the tagged commit.
# A tag with a "-" (1.0.0-beta.1) is published as a pre-release. The release
# notes are that version's CHANGELOG.md section. "Run workflow" by hand
# builds the same files as an artifact, no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  images:
    uses: ./.github/workflows/images.yml

  release:
    needs: images
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium for 26.04 yet (Arborist's test)
    timeout-minutes: 40
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: The Stump images (built by the images job)
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.images.outputs.artifact }}
          path: dist/

      - name: Read the version
        id: v
        run: |
          VERSION=$(sed -n 's/^STUMP_RELEASE = "\(.*\)"/\1/p' final_firmware/example_node.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match STUMP_RELEASE $VERSION in final_firmware/example_node.py"
            exit 1
          fi
          if ! grep -qx "## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: MicroPython (cached)
        id: mp-cache
        uses: actions/cache@v4
        with:
          path: ~/micropython-f32
          key: micropython-f32-${{ hashFiles('scripts/build_micropython.sh') }}

      - name: Build MicroPython, single-precision floats
        if: steps.mp-cache.outputs.cache-hit != 'true'
        run: sh scripts/build_micropython.sh ~/micropython-f32

      - name: Test suite (a release is never built from a failing tree)
        run: |
          export MICROPYTHON=$HOME/micropython-f32/micropython
          python3 tests/run.py

      - name: Arborist (Arborist-<version>.html; the Stump images from dist/, MicroPython from micropython.org, its SHA-256 checked)
        run: |
          pip install --quiet mpy-cross==1.28.0.post2
          python3 scripts/build_arborist.py dist

      - name: Build the release files (reproducible)
        run: python3 scripts/build_release.py "${{ steps.v.outputs.version }}" dist

      - name: Sign SHA256SUMS with the release identity
        id: sign
        env:
          IDENTITY_B64: ${{ secrets.STUMP_RELEASE_IDENTITY }}
        run: |
          if [ -z "$IDENTITY_B64" ]; then
            echo "::warning::No STUMP_RELEASE_IDENTITY secret: SHA256SUMS is not Reticulum-signed (the Sigstore attestations still are). See docs/RELEASE.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --quiet rns==1.5.7
          echo "$IDENTITY_B64" | base64 --decode > "$RUNNER_TEMP/release.identity"
          python3 scripts/sign_release.py sign "$RUNNER_TEMP/release.identity" dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/release.identity"
          if [ -f RELEASE_SIGNING_KEY.txt ]; then
            python3 scripts/sign_release.py verify dist/SHA256SUMS dist/SHA256SUMS.rnsig RELEASE_SIGNING_KEY.txt
          else
            echo "::warning::RELEASE_SIGNING_KEY.txt isn't committed: users can't check the signature against a published key yet."
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check every hash
        run: cd dist && sha256sum -c SHA256SUMS

      # A second proof besides our own signature of SHA256SUMS. When
      # Sigstore's transparency log doesn't answer (a 500 from Rekor stopped
      # beta.57 twice, with nothing on their status page), the release still
      # goes out on our signature and its notes say the attestation is
      # missing; rerunning this job once Sigstore is back adds it.
      - name: Attest build provenance (Sigstore)
        id: attest
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: 'dist/*'

      - name: Release notes from CHANGELOG.md
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="## $V" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md
          {
            printf '\n---\n\n**Install:** download `Stump-%s.zip`, unzip it, and run `python3 provisioner.py` inside the folder (see the README).\n\n' "$V"
            printf '**Verify:**\n\n```\nsha256sum -c SHA256SUMS\n'
            if [ "${{ steps.attest.outcome }}" = "success" ]; then
              printf 'gh attestation verify Stump-%s.zip --repo %s\n' "$V" "$GITHUB_REPOSITORY"
            fi
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              printf 'python3 scripts/sign_release.py verify SHA256SUMS SHA256SUMS.rnsig RELEASE_SIGNING_KEY.txt\n'
            fi
            printf '```\n\nBuilt from %s by [this run](%s/%s/actions/runs/%s). Rebuilding the same commit with `scripts/build_release.py` gives byte-identical files.\n\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ "${{ steps.attest.outcome }}" != "success" ]; then
              printf '*No Sigstore attestation: their transparency log did not answer when this was built. The files are signed with the release identity (SHA256SUMS.rnsig) all the same.*\n\n'
            fi
            printf '```\n'; cat dist/SHA256SUMS; printf '```\n'
          } >> notes.md
          cat notes.md

      - name: Keep the files as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stump-${{ steps.v.outputs.version }}
          path: dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Stump ${{ steps.v.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.prerelease }}
          files: dist/*

  # Stump OS, the Raspberry Pi image (pi/README.md): built once the release
  # is out, then put on it, with Raspberry Pi Imager's catalogue.
  pi-image:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/pi-image.yml
    with:
      version: ${{ needs.release.outputs.version }}
      publish: true
